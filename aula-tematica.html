<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula temática · RMI · IES Alquipir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a3b1f">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe2; --paper2:#efe4cf; --card:#fffaf1; --ink:#2c2418; --ink2:#6b5d48;
    --line:#d9c9ab; --accent:#8a3b1f;
    --ok:#3f7d4e; --warn:#c98a16; --bad:#b23a2a; --none:#a99a80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 20% 10%,#fbf6ec 0,transparent 45%),radial-gradient(circle at 85% 90%,#ebdfc6 0,transparent 40%);
    min-height:100vh;line-height:1.5}
  header{text-align:center;padding:1.6rem 1.2rem .6rem;position:relative}
  .eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .cod{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.14em;color:#fff;background:var(--ink);border-radius:999px;padding:.2rem .8rem;margin-top:.5rem}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;margin:.35rem 0 .2rem}
  h1 em{color:var(--accent)}
  .sub{color:var(--ink2);max-width:640px;margin:.4rem auto 0;font-size:.92rem}
  .volver{position:absolute;top:1rem;left:1rem;z-index:20;display:inline-flex;align-items:center;gap:.5rem;font-size:1.05rem;font-weight:700;color:#fff;text-decoration:none;background:var(--accent);border-radius:999px;padding:.65rem 1.3rem;box-shadow:0 4px 14px rgba(60,40,10,.2);transition:background .2s,transform .2s}
  .volver:hover{background:#6f2e17;transform:translateX(-3px)}
  @media (max-width:820px){header{padding-top:4.6rem}}
  main{max-width:1000px;margin:0 auto;padding:.6rem 1.2rem 3rem}

  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;background:var(--none)}
  .d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-none{background:var(--none)}

  /* ---------- Los dos equipos ---------- */
  .devs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-top:1rem}
  .dev{position:relative;font-family:inherit;color:inherit;text-align:center;cursor:pointer;background:var(--card);border:3px solid var(--line);border-radius:22px;
    padding:1.6rem 1.2rem 1.2rem;box-shadow:0 6px 24px rgba(60,40,10,.08);transition:transform .2s,box-shadow .2s,border-color .2s;
    opacity:0;transform:translateY(22px)}
  .dev.visible{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease,box-shadow .2s,border-color .2s}
  .dev:hover,.dev:focus-visible{transform:translateY(-6px);box-shadow:0 14px 34px rgba(60,40,10,.16);outline:none}
  .dev img{width:min(100%,300px);aspect-ratio:260/233;object-fit:contain;display:block;margin:0 auto .8rem;filter:drop-shadow(0 6px 10px rgba(60,40,10,.25));transition:filter .2s}
  .dev h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:2rem;line-height:1.05}
  .dev .st{display:inline-flex;align-items:center;gap:.45rem;font-size:.9rem;font-weight:600;color:var(--ink2);margin-top:.4rem}
  .dev .nota{font-size:.88rem;color:var(--ink2);white-space:pre-wrap;margin-top:.5rem;text-align:left;background:var(--paper);border-radius:12px;padding:.5rem .8rem}
  .dev .nota:empty{display:none}
  .dev .act{display:block;margin-top:.8rem;font-weight:700;color:var(--accent);font-size:.92rem}
  .dev .flag{position:absolute;top:1rem;right:1rem;width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--none);box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .dev[data-st="ok"]{border-color:var(--ok)} .dev[data-st="ok"] .flag{background:var(--ok)}
  .dev[data-st="warn"]{border-color:var(--warn)} .dev[data-st="warn"] .flag{background:var(--warn)}
  .dev[data-st="bad"]{border-color:var(--bad)} .dev[data-st="bad"] .flag{background:var(--bad);animation:pulse 1.6s infinite}
  .dev[data-st="bad"] img{filter:grayscale(.6) brightness(.85)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,42,.6)}50%{box-shadow:0 0 0 8px rgba(178,58,42,0)}}
  .legend{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-top:1.3rem;font-size:.82rem;color:var(--ink2)}
  .legend span{display:flex;align-items:center;gap:.4rem}
  .devs.n4{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .dev .det{font-size:.9rem;color:var(--ink2);margin-top:.15rem}
  /* ---------- Micrófonos (equipo de sonido) ---------- */
  .mics{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:.4rem;margin-top:.7rem}
  .dev[data-id="SONIDO"] img,#mImg[src*="1795775270665"]{mix-blend-mode:multiply;filter:none}
  .mic{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:600;color:var(--ink2);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:.15rem .55rem}
  .mic[data-st="ok"]{border-color:var(--ok)} .mic[data-st="warn"]{border-color:var(--warn)} .mic[data-st="bad"]{border-color:var(--bad);color:var(--bad)}
  .micres{font-size:.85rem;color:var(--ink2);margin-top:.4rem}
  #micBox{display:none} #micBox.on{display:block}
  .mics.n18{display:flex;flex-wrap:wrap;justify-content:center;gap:.3rem}
  .mics.n18 .mic{font-size:.72rem;padding:.1rem .45rem}
  .dev[data-id="ALTAVOZ"] img,#mImg[src*="altavoz"]{mix-blend-mode:multiply;filter:none}
  .microw{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}
  .microw:last-child{border-bottom:none}
  .microw b{flex:1;font-size:.9rem;font-weight:600}
  .microw button{font-family:inherit;font-size:.78rem;font-weight:600;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .6rem;cursor:pointer;color:var(--ink)}
  .microw button.sel[data-v="ok"]{border-color:var(--ok);background:#e7f1e8}
  .microw button.sel[data-v="warn"]{border-color:var(--warn);background:#fbf0d9}
  .microw button.sel[data-v="bad"]{border-color:var(--bad);background:#f8e1dd}
  .noexiste{text-align:center;margin-top:2rem;color:var(--ink2)}

  /* ---------- Ventana modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(44,36,24,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:1rem;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{background:var(--card);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:1.6rem;box-shadow:0 20px 60px rgba(0,0,0,.3);
    transform:translateY(20px) scale(.97);transition:transform .25s}
  .overlay.open .modal{transform:none}
  .mhead{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
  .mhead img{width:90px;max-height:90px;object-fit:contain}
  .mhead h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.9rem;line-height:1}
  .mhead small{color:var(--ink2)}
  .close{margin-left:auto;align-self:flex-start;background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--ink2);line-height:1}
  .label{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:.8rem 0 .4rem}
  .states{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .states label{border:2px solid var(--line);border-radius:12px;padding:.55rem .4rem;text-align:center;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3rem;transition:all .15s}
  .states input{display:none}
  .states input:checked+label.s-ok{border-color:var(--ok);background:#e7f1e8}
  .states input:checked+label.s-warn{border-color:var(--warn);background:#fbf0d9}
  .states input:checked+label.s-bad{border-color:var(--bad);background:#f8e1dd}
  .quick{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem}
  .chip{font-family:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .7rem;cursor:pointer}
  .chip:hover{background:var(--paper2)}
  textarea,input[type=text]{width:100%;font-family:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:12px;padding:.7rem;background:#fff;color:var(--ink)}
  textarea{min-height:130px;resize:vertical}
  textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{font-family:inherit;font-size:.9rem;font-weight:600;border-radius:999px;padding:.55rem 1.1rem;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s}
  .btn:hover{background:var(--paper2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#6f2e17}
  .btn.danger{color:var(--bad)}
  .mfoot{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
  .meta{font-size:.78rem;color:var(--ink2);margin-top:.5rem}
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,200px);background:var(--ink);color:#fff;padding:.6rem 1.2rem;border-radius:999px;font-size:.9rem;transition:transform .3s;z-index:60}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <a class="volver" id="volver" href="aulas-tematicas.html">← Volver a Aulas Temáticas</a>
  <div class="eyebrow" id="nivel">Aulas temáticas</div>
  <span class="cod" id="cod"></span>
  <h1 id="titulo">Aula</h1>
  <p class="sub" id="subt">Pincha en el ordenador o en la pantalla para anotar si funciona bien o si presenta algún problema.</p>
</header>

<main>
  <div class="devs" id="devs"></div>
  <div class="legend">
    <span><span class="dot d-ok"></span>Funciona bien</span>
    <span><span class="dot d-warn"></span>Con incidencias</span>
    <span><span class="dot d-bad"></span>No funciona</span>
    <span><span class="dot d-none"></span>Sin revisar</span>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead">
      <img id="mImg" src="" alt="">
      <div><h2 id="mTitle">Equipo</h2><small id="mSub"></small></div>
      <button class="close" id="mClose" aria-label="Cerrar">×</button>
    </div>
    <div class="label">Estado</div>
    <div class="states">
      <input type="radio" name="st" id="st-ok" value="ok"><label for="st-ok" class="s-ok"><span class="dot d-ok"></span>Funciona bien</label>
      <input type="radio" name="st" id="st-warn" value="warn"><label for="st-warn" class="s-warn"><span class="dot d-warn"></span>Con incidencias</label>
      <input type="radio" name="st" id="st-bad" value="bad"><label for="st-bad" class="s-bad"><span class="dot d-bad"></span>No funciona</label>
    </div>
    <div id="micBox">
      <div class="label">Micrófonos</div>
      <div id="micList"></div>
    </div>
    <div class="label">Anotaciones</div>
    <div class="quick" id="quick"></div>
    <textarea id="mNote" placeholder="Describe el problema…"></textarea>
    <div class="label">Anotado por</div>
    <input type="text" id="mWho" placeholder="Nombre del profesor/a (opcional)">
    <div class="meta" id="mMeta"></div>
    <div class="mfoot">
      <button class="btn danger" id="mClear">Vaciar ficha</button>
      <button class="btn" id="mCancel">Cancelar</button>
      <button class="btn primary" id="mSave">Guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="rmi-sync.js?v=2"></script>
<script src="tematicas-data.js?v=7"></script>
<script>
const COD = (new URLSearchParams(location.search).get("a") || "").toUpperCase();
const AULA = TEM_AULAS.find(a => a.cod === COD);
const EQS = temEquiposDe(AULA);
const LAB = {ok: "Funciona bien", warn: "Con incidencias", bad: "No funciona", none: "Sin revisar"};
const QUICKS = {
  PROF:  ["No enciende torre","Pantalla sin señal","Falta ratón","Falta teclado","Ratón no funciona","Teclado no funciona","Sin Internet","Va muy lento","No inicia sesión","Problema de sonido","Problema de espacio en disco duro"],
  SMART: ["No enciende","El táctil no responde","No se ve el ordenador","Sin sonido","Rotuladores no funcionan","Sin conexión a Internet","Pantalla con líneas o manchas"],
  PROYECTOR: ["No enciende","Sin señal del ordenador","Imagen borrosa o desenfocada","Colores raros","Lámpara agotada / aviso de lámpara","Se apaga solo","Falta el mando","Ventilador muy ruidoso"],
  SONIDO: ["No enciende","No se oye nada","Se oye con ruido o zumbido","Acopla (pitido)","Falta algún micrófono","Micrófono sin pilas","Falta el mando","Cable suelto o roto"],
  ALTAVOZ: ["No suena","Suena solo un altavoz","Se oye con ruido o zumbido","Volumen muy bajo","Cable suelto o roto","Altavoz descolgado o suelto"],
  PORTATILES: ["Faltan portátiles","Faltan cargadores","No cargan","Carro o armario no carga","Cerradura o llave","Cables dañados"],
};
const DET = {SONIDO: "Amplificador Denon", PORTATILES: "Marca HP"};
/* Elementos que se revisan uno a uno dentro de un equipo: micrófonos del sonido o portátiles del carro */
const SUB = {
  mics: {chip: "Mic ",  largo: "Micrófono ", plural: "micrófonos", titulo: "Micrófonos"},
  subs: {chip: "P",     largo: "Portátil ",  plural: "portátiles", titulo: "Portátiles", pad: true},
};
const subKey = e => e.subs ? "subs" : (e.mics ? "mics" : null);
const subN = e => e.subs || e.mics || 0;
const subNum = (e, i) => SUB[subKey(e)].pad ? String(i).padStart(2, "0") : String(i);
const MLAB = {ok: "Funciona", warn: "Falla", bad: "No funciona"};
const BAD = ["No enciende torre","No enciende"];

if (!AULA) {
  titulo.textContent = "Aula no encontrada";
  devs.outerHTML = '<p class="noexiste">No se ha encontrado esa aula. Vuelve a <a href="aulas-tematicas.html">Aulas Temáticas</a> y elige una.</p>';
} else {
  document.title = AULA.cod + " · " + AULA.nombre + " · RMI";
  nivel.textContent = AULA.aparte ? "RMI · " + AULA.nivel : "Aulas temáticas · " + AULA.nivel;
  if (AULA.aparte) { volver.href = "index.html"; volver.textContent = "← Volver a RMI"; }
  cod.textContent = AULA.cod;
  titulo.innerHTML = AULA.nombre.replace(/^(Aula de |Aula |Laboratorio de )(.+)$/, "$1<em>$2</em>").replace(/^([^<]+ · )(.+)$/, "$1<em>$2</em>");
  if (EQS.length > 2) { devs.classList.add("n" + EQS.length); subt.textContent = "Pincha en cada equipo para anotar si funciona bien o si presenta algún problema."; }
  EQS.forEach(e => {
    const b = document.createElement("button");
    b.className = "dev"; b.type = "button"; b.dataset.id = e.id;
    b.innerHTML = `<span class="flag"></span><img src="${e.img}" alt=""><h2>${e.nombre}</h2>${DET[e.id] ? `<div class="det">${DET[e.id]}${subN(e) ? " · " + subN(e) + " " + SUB[subKey(e)].plural : ""}</div>` : ""}
      ${subN(e) ? `<div class="mics n${subN(e)}">${Array.from({length: subN(e)}, (_, i) => `<span class="mic" data-m="${i + 1}"><span class="dot"></span>${SUB[subKey(e)].chip}${subNum(e, i + 1)}</span>`).join("")}</div><div class="micres"></div>` : ""}
      <div class="st"><span class="dot"></span><span class="stt">Sin revisar</span></div><div class="nota"></div>
      <span class="act">Anotar estado →</span>`;
    b.addEventListener("click", () => openModal(e.id));
    devs.appendChild(b);
  });
}

/* ---------- Almacenamiento compartido (una sola hoja para todas las aulas temáticas) ---------- */
let data = {};
try { data = JSON.parse(localStorage.getItem(TEM_KEY)) || {}; } catch (e) { data = {}; }
const SYNC = RMISync.attach(TEM_KEY, () => data, d => { data = d; try { localStorage.setItem(TEM_KEY, JSON.stringify(data)); } catch (e) {} refresh(); });
function persist(){ try { localStorage.setItem(TEM_KEY, JSON.stringify(data)); } catch (e) {} SYNC.push(); }
const fid = id => COD + "-" + id;
const eqOf = id => TEM_EQUIPOS.find(e => e.id === id);

function refresh(){
  if (!AULA) return;
  EQS.forEach(e => {
    const d = data[fid(e.id)] || {}, st = d.st || "none";
    const el = devs.querySelector(`.dev[data-id="${e.id}"]`);
    el.dataset.st = st;
    el.querySelector(".st .dot").className = "dot d-" + st;
    el.querySelector(".stt").textContent = LAB[st] + (d.date ? " · " + d.date : "");
    el.querySelector(".nota").textContent = d.note || "";
    if (subN(e)) {
      const m = d[subKey(e)] || {}, n = subN(e), T = SUB[subKey(e)].titulo; let ok = 0, rev = 0;
      el.querySelectorAll(".mic").forEach(x => { const v = m[x.dataset.m] || "none"; x.dataset.st = v; x.querySelector(".dot").className = "dot d-" + v; if (v !== "none") rev++; if (v === "ok") ok++; });
      el.querySelector(".micres").textContent = rev ? `${T}: ${ok} de ${n} funcionan bien` + (rev < n ? ` (${n - rev} sin revisar)` : "") : `${T} sin revisar`;
    }
  });
}

/* ---------- Ventana ---------- */
let current = null, micState = {};
function openModal(id){
  current = id; const e = eqOf(id), d = data[fid(id)] || {};
  mTitle.textContent = e.nombre; mSub.textContent = AULA.cod + " · " + AULA.nombre; mImg.src = e.img;
  quick.innerHTML = "";
  QUICKS[id].forEach(q => {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = "+ " + q;
    b.onclick = () => { const t = mNote.value.trim(); mNote.value = (t ? t + "\n" : "") + "• " + q;
      if (!document.querySelector("input[name=st]:checked")) document.getElementById(BAD.includes(q) ? "st-bad" : "st-warn").checked = true;
      mNote.focus(); };
    quick.appendChild(b);
  });
  document.querySelectorAll("input[name=st]").forEach(r => r.checked = r.value === d.st);
  micState = Object.assign({}, (subKey(e) && d[subKey(e)]) || {});
  micBox.classList.toggle("on", !!subN(e));
  if (subN(e)) micBox.querySelector(".label").textContent = SUB[subKey(e)].titulo;
  micList.innerHTML = "";
  for (let i = 1; i <= subN(e); i++) {
    const row = document.createElement("div"); row.className = "microw";
    row.innerHTML = `<b>${SUB[subKey(e)].largo}${subNum(e, i)}</b>` + ["ok", "warn", "bad"].map(v => `<button type="button" data-v="${v}">${MLAB[v]}</button>`).join("");
    const paint = () => row.querySelectorAll("button").forEach(x => x.classList.toggle("sel", micState[i] === x.dataset.v));
    row.querySelectorAll("button").forEach(x => x.onclick = () => { if (micState[i] === x.dataset.v) delete micState[i]; else micState[i] = x.dataset.v;
      if (micState[i] && micState[i] !== "ok" && !document.querySelector("input[name=st]:checked")) document.getElementById("st-warn").checked = true;
      paint(); });
    paint(); micList.appendChild(row);
  }
  mNote.value = d.note || ""; mWho.value = d.who || lsGet("infortec-who");
  mMeta.textContent = d.date ? "Última actualización: " + d.date : "Aún no hay anotaciones.";
  overlay.classList.add("open");
  setTimeout(() => mNote.focus(), 150);
}
function closeModal(){ overlay.classList.remove("open"); current = null; }
function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

mSave.onclick = () => {
  const st = (document.querySelector("input[name=st]:checked") || {}).value || "";
  const note = mNote.value.trim(), who = mWho.value.trim();
  const hasMics = subN(eqOf(current)) && Object.keys(micState).length;
  if (!st && !note && !hasMics) delete data[fid(current)];
  else { data[fid(current)] = {st, note, who, date: new Date().toLocaleString("es-ES", {dateStyle: "short", timeStyle: "short"})};
         if (hasMics) data[fid(current)][subKey(eqOf(current))] = micState; }
  try { if (who) localStorage.setItem("infortec-who", who); } catch (e) {}
  const name = eqOf(current).nombre;
  persist(); refresh(); toast(name + " guardado"); closeModal();
};
mClear.onclick = () => { delete data[fid(current)]; persist(); refresh(); toast("Ficha vaciada"); closeModal(); };
mCancel.onclick = closeModal; mClose.onclick = closeModal;
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && current !== null) mSave.click();
});
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); }), {threshold: .08});
document.querySelectorAll(".dev").forEach((d, i) => { d.style.transitionDelay = (i * 120) + "ms"; io.observe(d); });
refresh();
